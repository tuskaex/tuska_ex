# ============================================================
# TuskaEx — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================
name: tuskaex

services:
  # ── Infrastructure — restart policy only (no host ports needed) ──
  postgres:
    restart: always

  timescaledb:
    restart: always

  redis:
    restart: always

  # Kafka + Zookeeper + kafka-ui removed (see docker-compose.yml).

  # ── Backend services — restart policy + localhost-only ports ──
  #
  # `ports: !override` is load-bearing, not decoration. Compose MERGES the
  # `ports` sequence across -f files instead of replacing it, so the base
  # docker-compose.yml bindings ("8000:8000", "8001:8001", "3010:3000",
  # "3011:3001") stayed live alongside the 127.0.0.1 ones below — publishing
  # the gateway and admin API on 0.0.0.0, i.e. straight to the internet,
  # bypassing nginx and Cloudflare entirely. ufw does NOT save you here:
  # Docker writes its own iptables rules ahead of the ufw chain.
  # !override (Compose >= 2.24) replaces the list instead of appending to it.
  # Verify after any change to this file — no 0.0.0.0 may appear in:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
  admin-api:
    ports: !override
      - "127.0.0.1:8003:8001"
    restart: always
    environment:
      # Admin API is reached exclusively from the admin SPA — never from
      # the trader or marketing domain. Lock CORS to admin.tuskaex.com
      # so a compromise of the other surfaces can't pivot here.
      CORS_ORIGINS: https://admin.tuskaex.com
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]

  gateway:
    ports: !override
      - "127.0.0.1:8002:8000"
    restart: always
    environment:
      # tuskaex.com is the apex marketing host and ALSO serves the
      # auth pages (see frontend/trader/src/middleware.ts file header) —
      # so a login POST from /auth/login on the apex carries
      # Origin: https://tuskaex.com and gateway must accept it.
      # Removing the apex broke login entirely (403 "Origin not allowed").
      #
      # The C1 audit risk this re-enables — XSS on the marketing site
      # pivoting to credentialed API calls — is mitigated properly by
      # moving the auth flow off the apex (TODO: redirect /auth/* on
      # tuskaex.com to trade.tuskaex.com so the apex no longer
      # needs gateway access). Until that's done we keep parity with
      # the pre-audit allow-list.
      CORS_ORIGINS: https://tuskaex.com,https://trade.tuskaex.com,https://admin.tuskaex.com
      COOKIE_DOMAIN: .tuskaex.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    command: ["uvicorn", "services.gateway.src.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  market-data:
    restart: always

  b-book-engine:
    restart: always

  risk-engine:
    restart: always

  # ── Frontends — build with production domain + restart ──────
  trader-frontend:
    build:
      context: ./frontend/trader
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-production}
        NEXT_PUBLIC_WS_URL: wss://api.tuskaex.com
        NEXT_PUBLIC_MARKETING_HOST: tuskaex.com
        NEXT_PUBLIC_TRADE_HOST: trade.tuskaex.com
        # Baked into the bundle at build time so the Google Sign-In button can render.
        # Same value as backend GOOGLE_CLIENT_ID. Leave blank to hide the button.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        # WalletConnect (Reown Cloud) project id for RainbowKit. Without it,
        # only browser-injected wallets (MetaMask, OKX) work; the WalletConnect
        # mobile-deeplink path (Trust Wallet etc.) is disabled.
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        # The trading terminal on its own domain; tuskaex.com keeps the CRM.
        # This container serves BOTH hostnames from one build — the value is
        # identical either way, and src/lib/terminalHandoff.ts decides at
        # runtime whether the current host IS the terminal or must hand off.
        #
        # Read from .env rather than hard-coded, and that is the point: this is
        # the switch that redirects every "Trade" click off this domain. Leave
        # it blank until speedtrade.tech is confirmed serving, then set it
        # and rebuild. Blanking it and rebuilding is the rollback.
        NEXT_PUBLIC_TERMINAL_ORIGIN: ${NEXT_PUBLIC_TERMINAL_ORIGIN:-}
    ports: !override
      - "127.0.0.1:3012:3000"
    environment:
      INTERNAL_API_URL: http://gateway:8000/api/v1
      TRADER_API_PROXY_TARGET: http://gateway:8000
      # Browser WebSocket connects directly to api subdomain
      NEXT_PUBLIC_WS_URL: wss://api.tuskaex.com
      # Host pair for the marketing/app domain split (read by src/middleware.ts)
      NEXT_PUBLIC_MARKETING_HOST: tuskaex.com
      NEXT_PUBLIC_TRADE_HOST: trade.tuskaex.com
      NEXT_PUBLIC_TERMINAL_ORIGIN: ${NEXT_PUBLIC_TERMINAL_ORIGIN:-}
      # DO NOT set NEXT_PUBLIC_GATEWAY_URL — browser uses same-origin /api/v1 proxy (avoids CORS)
    restart: always

  admin-frontend:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PLATFORM_ADMIN_HOST: admin.tuskaex.com
    ports: !override
      - "127.0.0.1:3013:3001"
    environment:
      ADMIN_API_PROXY_TARGET: http://admin-api:8001
      # TuskaEx's own admin hostname. Every OTHER host this container answers on
      # is a white-label tenant's back office and must wear their brand, not
      # ours. Unset ⇒ everything is treated as TuskaEx (local dev).
      NEXT_PUBLIC_PLATFORM_ADMIN_HOST: admin.tuskaex.com
    restart: always
