# trade.speedtrade.tech — the TuskaEx trading terminal.
#
# tuskaex.com keeps the CRM (dashboard, wallet, KYC, deposits, IB, support);
# this host serves the trading terminal. Both are the SAME Next app in the same
# `trader_frontend` container — only the hostname differs, and the app branches
# on it at runtime.
#
# Why this file is in the TuskaEx repo and not next to speedtrade.tech's own
# config: everything here proxies to TuskaEx's containers, and TuskaEx's
# deploy.sh is what installs it. `speedtrade_landing/` is gitignored by this
# repo, so a server block placed there would never reach the server through a
# deploy — it would silently keep serving whatever was last copied by hand.
# speedtrade.tech and www.speedtrade.tech stay in that other file; only
# trade.speedtrade.tech is ours.
#
# Install (deploy.sh does this automatically when deploy/nginx/ changes):
#   sudo cp deploy/nginx/terminal.conf /etc/nginx/sites-available/terminal.conf
#   sudo ln -sf /etc/nginx/sites-available/terminal.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Without a server block for this hostname, nginx falls back to its default
# server — the first 443 block it loaded, which is tuskaex.conf's www→apex
# redirect. Every request would be answered `301 → https://tuskaex.com/` by our
# own nginx, which looks like a Cloudflare rule because a proxied response
# always carries `Server: cloudflare`.
#
# Upstreams `trader_frontend` and `gateway_api` are declared in tuskaex.conf.
# nginx resolves upstreams across all loaded files, so this is fine — and
# `nginx -t` is what tells you if that ever stops being true.
#
# SSL: reuses TuskaEx's origin certificate, which covers tuskaex.com and
# *.tuskaex.com and NOT this domain. It works only because Cloudflare sits in
# front in Full (not Full strict) mode. Same stopgap as speedtrade.conf, and
# the same fix — a Cloudflare Origin certificate for speedtrade.tech.

# ── HTTP → HTTPS (Cloudflare normally does this first) ────────
server {
    listen 80;
    listen [::]:80;
    server_name trade.speedtrade.tech;
    return 301 https://$host$request_uri;
}

# ── The terminal ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trade.speedtrade.tech;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Same policy as trade.tuskaex.com, with one addition: wss://trade.speedtrade.tech
    # is named explicitly. The sockets are same-origin here (see the /ws/ block
    # below), and while CSP3 says `'self'` covers a same-origin wss: upgrade,
    # enough browser versions disagree that spelling it out is cheaper than
    # debugging a terminal that connects on Chrome and not on Safari.
    # api.tuskaex.com stays listed for anything that bypasses the same-origin proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://accounts.google.com https://*.googleusercontent.com https://verify.walletconnect.com https://verify.walletconnect.org https://s3.tradingview.com https://www.tradingview-widget.com https://www.tradingview.com https://static.cloudflareinsights.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' wss://trade.speedtrade.tech https://api.tuskaex.com wss://api.tuskaex.com https://accounts.google.com https://www.googleapis.com https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://verify.walletconnect.com https://cloudflareinsights.com https://static.cloudflareinsights.com https://*.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' blob: https://accounts.google.com https://verify.walletconnect.com https://verify.walletconnect.org https://www.tradingview-widget.com https://s.tradingview.com https://www.tradingview.com https://*.razorpay.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 15M;

    limit_req zone=web_limit burst=40 nodelay;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # The trader app serves every route on whichever host it is reached
    # through — that is deliberate (see src/middleware.ts: redirecting
    # non-terminal paths back to the apex broke RSC prefetches with CORS
    # errors). The side effect is that the CRM pages are *reachable* here even
    # though tuskaex.com is their canonical home, so keep crawlers out rather
    # than publish a second indexable copy of the whole app.
    location = /robots.txt {
        # default_type, not `add_header Content-Type` — add_header appends, so
        # that would emit two Content-Type headers alongside the one nginx sets
        # for `return`.
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── WebSocket endpoints ───────────────────────────────────
    # This host needs its own /ws/ upgrade block — trade.tuskaex.com does not
    # have one, and WEB_TERMINAL_API.md tells terminals to connect to
    # api.tuskaex.com instead. That advice does not survive the domain split:
    # this terminal's session cookie is scoped to .speedtrade.tech, and a
    # browser will never send it to api.tuskaex.com. /ws/trades authenticates
    # from that cookie, so a cross-domain connect closes 4003 and the terminal
    # silently stops receiving fills, closes and stop-outs.
    #
    # Proxying to the same `gateway_api` upstream keeps the socket terminating
    # in exactly the same place; only the hostname the browser dials changes,
    # which is what makes the cookie same-site and therefore sent.
    # src/lib/ws/getWebSocketBaseUrl.ts is the client half of this.
    location /ws/ {
        proxy_pass http://gateway_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://trader_frontend;
        proxy_http_version 1.1;
        # $host, not a literal: the gateway reads this (forwarded on as
        # X-Forwarded-Host by the Next API proxy) to decide the auth cookie's
        # Domain. Hard-code it and every session issued here gets a
        # .tuskaex.com cookie this host can never send back.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://trader_frontend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # TradingView charting library: dozens of hashed bundles load at once and
    # tripped web_limit on a cold cache, 503-ing the chart. Static and
    # immutable, so it skips the rate limit and caches hard.
    location /charting_library/ {
        proxy_pass http://trader_frontend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
