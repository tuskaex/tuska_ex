# Every white-label tenant domain, served without a per-domain vhost.
#
# connect-tenant-domain.sh writes one file per tenant. That works, but it makes
# connecting a domain an SSH step: a super-admin who onboards ten brokers has to
# get someone onto the box ten times, and until they do the tenant's domain
# lands on whichever server block nginx happened to load first — today
# speedtrade.tech's, so the broker's own domain 301s to a competitor's site.
# The database already says READY at that point, so nothing surfaces the gap.
#
# Nothing in a tenant vhost is actually per-tenant. The upstreams are the same,
# the branding routes are the same, and the app decides whose brand to paint
# from the Host header at runtime. So one catch-all covers every tenant that
# will ever exist, and connecting a domain becomes DNS-only.
#
# ── What still has to be done per tenant ─────────────────────────────────
# The domain must be in the platform's Cloudflare account with the records
# PROXIED (orange cloud) and SSL/TLS set to Full — NOT Full (strict). The
# certificate below is TuskaEx's origin cert; it covers tuskaex.com and
# *.tuskaex.com and cannot cover a customer's domain. Cloudflare terminates TLS
# for the visitor and re-encrypts to us, and in Full mode it does not verify
# our certificate's name. Grey-cloud a record, or point DNS straight here, and
# the visitor gets a name-mismatch warning.
#
# ── Why this does not disturb the platform's own hosts ───────────────────
# nginx matches server_name by exact name first, then wildcard, then regex, and
# only falls back to default_server when nothing matched. tuskaex.com,
# admin.tuskaex.com, api.tuskaex.com, trade.tuskaex.com and speedtrade.tech all
# have exact blocks, so they keep winning and are unaffected by this file.
# admin.<tenant>.com has no exact block, so it lands on the regex block below.
#
# An explicit default_server also removes an accident: no other file declares
# one, so the default was whichever block loaded first — a property of filename
# order, not of anyone's intent.

# nginx variable names allow only [A-Za-z0-9_]. Per-tenant files each define
# their own upgrade map, so this one is named distinctly to avoid a duplicate
# when a hand-written tenant vhost is also present.
map $http_upgrade $conn_upgrade_catchall {
    default upgrade;
    ''      close;
}

# Which app answers: admin.<domain> gets the back office, everything else the
# trader app. Decided here rather than with two near-identical server blocks so
# the routing rule is stated once.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01, kept above the redirect so a future --issue-cert
    # run can validate over plain HTTP against a certificate that does not
    # exist yet.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Tenant admin panel: admin.<anything> ─────────────────────────────────
# Regex, so it matches admin.stockpip.com but loses to the exact
# admin.tuskaex.com block. Listed before the default_server block for
# readability only — nginx picks by name, not by file order.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^admin\..+$;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 15M;
    limit_req zone=web_limit burst=40 nodelay;

    # Host forwarded verbatim: the app reads it to decide whose branding to
    # paint, and the gateway reads it to scope the auth cookie's Domain.
    # Every proxy_set_header sits at server level because nginx's inheritance
    # is all-or-nothing — one such directive inside a location discards the
    # whole inherited set.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $conn_upgrade_catchall;

    # Branding lives on the admin service. The admin app proxies /api/v1/* to
    # the gateway, which has no branding router, so these two prefixes bypass
    # it or they 404. Both are unauthenticated by design — a visitor at the
    # login screen has no session yet and still has to see whose site this is.
    #
    # Scoped to these exact prefixes deliberately: /api/v1/admin/* is otherwise
    # the authenticated admin API, and routing all of it here would publish the
    # back office on every tenant domain.
    location /api/v1/public/branding/ {
        proxy_pass http://admin_api;
        proxy_read_timeout 30;
    }
    location /api/v1/admin/branding/media/ {
        proxy_pass http://admin_api;
        proxy_read_timeout 30;
        expires 7d;
    }

    location /_next/static/ {
        proxy_pass http://admin_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://admin_frontend;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

# ── Tenant trader app: every other unmatched host ────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 15M;
    limit_req zone=web_limit burst=40 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $conn_upgrade_catchall;

    # Same-origin sockets. A tenant's cookie is scoped to its own domain and is
    # never sent to api.tuskaex.com, so /ws/trades would close 4003 there and
    # the terminal would stop receiving fills while still looking connected.
    location /ws/ {
        proxy_pass http://gateway_api;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /api/v1/public/branding/ {
        proxy_pass http://admin_api;
        proxy_read_timeout 30;
    }
    location /api/v1/admin/branding/media/ {
        proxy_pass http://admin_api;
        proxy_read_timeout 30;
        expires 7d;
    }

    location /_next/static/ {
        proxy_pass http://trader_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /charting_library/ {
        proxy_pass http://trader_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://trader_frontend;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
