# speedtrade.tech — SpeedTrade landing site + the TuskaEx trading terminal.
#
# One hostname, two Next.js apps:
#   /                       → speedtrade_frontend  (the marketing site, /opt/speedtrade)
#   /trading/terminal       → trader_frontend      (the TuskaEx terminal)
#
# tuskaex.com keeps the CRM — dashboard, wallet, KYC, deposits, IB, support.
# Clicking "Trade" there mints a single-use handoff code and redirects here,
# because a .tuskaex.com cookie is never sent to a different registrable
# domain. See WEB_TERMINAL_API.md §2C.
#
# ── Why this file lives in the TuskaEx repo ───────────────────────────────
# It used to live in speedtrade_landing/deploy/nginx/. That directory is
# gitignored by this repo, so nothing there can reach the server through
# deploy.sh — and deploy.sh's `if [ -f ]` guard skipped it silently, which
# looks exactly like a successful deploy. Now that this vhost routes TuskaEx
# traffic it is TuskaEx's to deploy, and deploy.sh installs it unconditionally.
#
# ── The /_next/ problem, and why it is solved here and not in the app ─────
# Both apps serve their bundles from /_next/static/, so on a shared hostname
# that prefix can only be proxied to one of them — the other boots with no CSS
# or JS. The textbook fix is an `assetPrefix` on one app, moving its assets out
# of the way.
#
# We do it in nginx instead. /opt/speedtrade is NOT a git checkout; it was
# copied there by hand. An assetPrefix in its next.config.ts would be lost the
# next time anyone re-copies that tree, and the failure would be a terminal
# that renders unstyled with no error anywhere. Keeping the whole fix in this
# one file — which deploy.sh owns — means a landing redeploy cannot break the
# terminal.
#
# The mechanism: try the landing first, fall back to the trader on 404. Next
# content-hashes every chunk filename, so a name that exists in one build never
# exists in the other and the fallback can never serve the wrong file. The cost
# is one extra local 404 per trader asset on a cold cache; they are then cached
# immutable for a year.
#
# Landing goes first because it is the apex's primary app and a marketing page's
# first paint is SEO-visible, while the terminal's chunks are behind a login and
# cache hard after the first load.
#
# ── SSL ───────────────────────────────────────────────────────────────────
# Reuses TuskaEx's origin certificate, which covers tuskaex.com and
# *.tuskaex.com and NOT this domain. That works only because Cloudflare is in
# front in Full (not Full strict) mode. If the zone is ever set to Full
# (strict) this returns 526 immediately. The fix is a Cloudflare Origin
# certificate for speedtrade.tech and swapping the two paths below.

upstream speedtrade_frontend {
    # 3100, not 3000: TuskaEx's trader frontend already holds that port.
    server 127.0.0.1:3100;
}

# WebSocket upgrade, conditionally. Every proxy_set_header in this file lives
# at server level (see the block below for why), and a blanket
# `Connection: upgrade` on ordinary HTTP requests breaks keepalive. This maps
# it to "close" unless the client actually asked to upgrade.
#
# Prefixed name: a bare $connection_upgrade is the conventional spelling and
# would collide the moment another site file in this nginx defines its own.
map $http_upgrade $speedtrade_connection_upgrade {
    default upgrade;
    ''      close;
}
# trader_frontend and gateway_api are declared in tuskaex.conf. nginx resolves
# upstreams across all loaded files; `nginx -t` catches it if that stops
# being true.

# ── www → apex ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.speedtrade.tech;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    return 301 https://speedtrade.tech$request_uri;
}

# ── HTTP → HTTPS (Cloudflare normally does this first) ────────
server {
    listen 80;
    listen [::]:80;
    server_name speedtrade.tech www.speedtrade.tech;
    return 301 https://$host$request_uri;
}

# ── The site ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name speedtrade.tech;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Both apps set their own headers in their next configs; these are the ones
    # only a proxy can add. Deliberately no server-wide CSP: the terminal needs
    # 'unsafe-eval' and the TradingView hosts, the landing does not, and one
    # policy loose enough for both would weaken the landing for no reason. The
    # terminal's own CSP is set on its locations below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    client_max_body_size 15M;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Shared proxy settings ─────────────────────────────────
    #
    # EVERY proxy_set_header this file needs is here, and NO location below
    # declares one. nginx's inheritance for proxy_set_header is all-or-nothing:
    # a single proxy_set_header inside a location discards the entire inherited
    # set. Adding just `Upgrade` to a location silently drops Host,
    # X-Real-IP, X-Forwarded-For and X-Forwarded-Proto with it.
    #
    # That is not a theoretical tidiness point. It shipped once and broke the
    # terminal in two ways at the same time: nginx fell back to
    # `Host: trader_frontend`, so the app's middleware saw a host that was not
    # the terminal's and bounced every /trading/terminal request into a
    # redirect loop; and the gateway, which reads that same name to choose the
    # auth cookie's Domain, would have issued .tuskaex.com cookies that this
    # host can never send back — a user logged out on arrival with nothing in
    # any log to explain it.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $speedtrade_connection_upgrade;

    # ══ TERMINAL — TuskaEx trader app ═════════════════════════

    # The terminal HTML. CSP is set here rather than server-wide; nginx's
    # add_header does not inherit into a location that declares its own, so the
    # four base headers are repeated.
    location /trading/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # wss://speedtrade.tech is named explicitly: the sockets are same-origin
        # (see /ws/ below) and although CSP3 says 'self' covers a same-origin
        # wss: upgrade, enough browser versions disagree that spelling it out is
        # cheaper than debugging a terminal that connects on Chrome and not on
        # Safari. api.tuskaex.com stays for anything bypassing the proxy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://accounts.google.com https://*.googleusercontent.com https://verify.walletconnect.com https://verify.walletconnect.org https://s3.tradingview.com https://www.tradingview-widget.com https://www.tradingview.com https://static.cloudflareinsights.com https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' wss://speedtrade.tech https://api.tuskaex.com wss://api.tuskaex.com https://accounts.google.com https://www.googleapis.com https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://verify.walletconnect.com https://cloudflareinsights.com https://static.cloudflareinsights.com https://*.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' blob: https://accounts.google.com https://verify.walletconnect.com https://verify.walletconnect.org https://www.tradingview-widget.com https://s.tradingview.com https://www.tradingview.com https://*.razorpay.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

        proxy_pass http://trader_frontend;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Staging route: on this host it simply redirects into /trading/terminal
    # (there is nothing to hand off — we are already the terminal). It exists
    # so a stray link cannot 404 on the landing app.
    location /terminal {
        proxy_pass http://trader_frontend;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # The trader's own API proxy through to the gateway. The landing app has no
    # route handlers at all, so this prefix is unambiguous.
    location /api/ {
        proxy_pass http://trader_frontend;
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # ── WebSocket endpoints ───────────────────────────────────
    # The terminal MUST use these rather than api.tuskaex.com: its session
    # cookie is scoped to .speedtrade.tech and a browser will not send it to
    # another registrable domain. /ws/trades authenticates from that cookie, so
    # a cross-domain connect closes 4003 and the terminal silently stops
    # receiving fills, closes and stop-outs. Same gateway either way — only the
    # hostname the browser dials changes, which is what makes the cookie
    # same-site. src/lib/ws/getWebSocketBaseUrl.ts is the client half.
    location /ws/ {
        proxy_pass http://gateway_api;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Trader static trees. None of these names exist in the landing app's
    # public/ directory (it has fonts/, icons/, images/), so there is no
    # ambiguity to resolve.
    location /charting_library/ {
        proxy_pass http://trader_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location /datafeeds/ {
        proxy_pass http://trader_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    # ── White-label: SpeedTrade branding on the terminal ──────
    #
    # One trader build serves both tuskaex.com and this host, so the brand
    # cannot be baked in — NEXT_PUBLIC_* is fixed at build time. Switching it
    # in React instead would mean a client-side host check, which the server
    # cannot evaluate: SSR would emit the TuskaEx mark and the browser would
    # swap it after hydration, so every load starts with a visible flash of the
    # wrong brand. Reading the Host in a server component avoids the flash but
    # opts the whole app out of static generation.
    #
    # So the swap happens here, where the host split already lives. These are
    # exact-match locations, which beat the /marketing/ prefix below.
    #
    # The replacements are proxied from the landing app rather than copied onto
    # disk, so updating SpeedTrade's logo updates the terminal's too and the
    # two can never drift.
    #
    # Discoverability is the one cost: the code still says "tuskaex-logo.png".
    # TuskaExWordmark.tsx carries a comment pointing back here.
    location = /marketing/tuskaex-logo.png {
        proxy_pass http://speedtrade_frontend/images/logo.png;
        expires 7d;
    }
    location = /marketing/tuskaex-logo-light.png {
        proxy_pass http://speedtrade_frontend/images/logo.png;
        expires 7d;
    }
    location = /marketing/tuskaex_fevicon.png {
        proxy_pass http://speedtrade_frontend/icons/icon-192.png;
        expires 7d;
    }
    # The browser tab. Next emits <link rel="icon" href="/icon.png?<hash>">
    # from app/icon.png; that path was not routed here at all, so it 404'd and
    # the tab fell back to the browser's blank-globe placeholder. The query
    # string is not part of the path, so `location =` still matches.
    location = /icon.png {
        proxy_pass http://speedtrade_frontend/icons/icon-192.png;
        expires 7d;
    }
    location = /favicon.ico {
        proxy_pass http://speedtrade_frontend/icons/icon-192.png;
        expires 7d;
    }

    location /marketing/ {
        proxy_pass http://trader_frontend;
        expires 7d;
    }
    location /tuskaex/ {
        proxy_pass http://trader_frontend;
        expires 7d;
    }

    # ══ THE SHARED PREFIX ═════════════════════════════════════
    # Landing first, trader on 404. See the file header for why this is here
    # and not an assetPrefix in the landing app.
    location /_next/ {
        proxy_pass http://speedtrade_frontend;
        proxy_intercept_errors on;
        error_page 404 = @trader_next;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location @trader_next {
        proxy_pass http://trader_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ══ EVERYTHING ELSE — the SpeedTrade landing site ═════════
    location / {
        proxy_pass http://speedtrade_frontend;
        proxy_read_timeout 60s;
    }
}
